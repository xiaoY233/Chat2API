name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write

    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
            args: --mac --x64 --arm64
          - os: windows-latest
            target: win
            args: --win --x64
          - os: ubuntu-latest
            target: linux
            args: --linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build application
        run: npm run build

      - name: Build and Publish (${{ matrix.target }})
        run: npx electron-builder ${{ matrix.args }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
